<div class="row">
  <div class="col col-12">
    <div class="card">
      <div class="card-body">
        <div class="row justify-content-center header-subject">
          ผู้ให้บริการ
        </div>
        <div class="row form-row">
          <div class="form-group col-12 provider-info">
            <table mat-table [dataSource]="dataSource">

              <ng-container matColumnDef="providerName">
                <th mat-header-cell *matHeaderCellDef> ชื่อผู้ให้บริการ </th>
                <td mat-cell *matCellDef="let element" class="first-data"><img src={{element?.logo_provider}}
                    class="rounded-circle" /><span class="first-data-on-table">
                    {{element.providerName}}</span>
                </td>
              </ng-container>

              <ng-container matColumnDef="telNumber">
                <th mat-header-cell *matHeaderCellDef> เบอร์โทรติดต่อ </th>
                <td mat-cell *matCellDef="let element"> {{element.telNumber}} </td>
              </ng-container>

              <ng-container matColumnDef="webUrl">
                <th mat-header-cell *matHeaderCellDef> เว็บไซต์ </th>
                <td mat-cell *matCellDef="let element"> {{element.webUrl}} </td>
              </ng-container>

                </th>
